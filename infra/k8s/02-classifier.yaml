apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackwall-classifier
  namespace: blackwall-system
  labels:
    app: blackwall-classifier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blackwall-classifier
  template:
    metadata:
      labels:
        app: blackwall-classifier
    spec:
      containers:
        - name: classifier
          image: ghcr.io/parsabe/blackwall-classifier:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: blackwall-classifier
  namespace: blackwall-system
spec:
  selector:
    app: blackwall-classifier
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
