apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackwall-ollama
  namespace: blackwall-system
  labels:
    app: blackwall-ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackwall-ollama
  template:
    metadata:
      labels:
        app: blackwall-ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
              name: http
          env:
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"
            - name: OLLAMA_HOST
              value: "0.0.0.0"
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: ollama-storage
          persistentVolumeClaim:
            claimName: ollama-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
  namespace: blackwall-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: blackwall-ollama
  namespace: blackwall-system
spec:
  selector:
    app: blackwall-ollama
  ports:
    - protocol: TCP
      port: 11434
      targetPort: 11434
      name: http
  type: ClusterIP
