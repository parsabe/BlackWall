apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackwall-gateway
  namespace: blackwall-system
  labels:
    app: blackwall-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blackwall-gateway
  template:
    metadata:
      labels:
        app: blackwall-gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/parsabe/blackwall-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: blackwall-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: blackwall-gateway
  namespace: blackwall-system
spec:
  selector:
    app: blackwall-gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
