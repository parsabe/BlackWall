version: '3.8'

services:
  classifier:
    build:
      context: ../classifier
      dockerfile: Dockerfile
    container_name: blackwall-classifier
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - blackwall-net

  ollama:
    image: ollama/ollama:latest
    container_name: blackwall-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_HOST=0.0.0.0
    networks:
      - blackwall-net

  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
    container_name: blackwall-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - CLASSIFIER_URL=http://classifier:8000
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=gemma3:1b
      - GATEWAY_TIMEOUT_SEC=120.0
    depends_on:
      classifier:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - blackwall-net

networks:
  blackwall-net:
    driver: bridge

volumes:
  ollama-data:
    name: blackwall-ollama-volume
